[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bracketeer"
version = "0.1.0"
description = "Tournament manager for game nights and small esports events"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aaron Light" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers", "--strict-config"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["bracketeer"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle errors and warnings
    "F",       # pyflakes: unused imports, undefined names
    "I",       # isort: import order
    "B",       # bugbear: likely bugs
    "UP",      # pyupgrade: modern Python 3.12 syntax
    "SIM",     # simplifications
    "S",       # flake8-bandit: security smells while editing
    "PT",      # pytest style
    "RUF",     # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest tests work

# ---------------------------------------------------------------- mutmut
[tool.mutmut]
# Copy the whole package so imports work inside mutmut's sandbox...
source_paths = ["src/"]
# ...but only mutate the logic layers. GUI, export and persistence mutants are mostly noise.
only_mutate = ["src/bracketeer/formats/*", "src/bracketeer/domain/*"]
pytest_add_cli_args_test_selection = ["tests/"]