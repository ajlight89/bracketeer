[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bracketeer"
version = "1.0.0"
description = "A Windows terminal app for organizing and running small gaming tournaments."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Aaron Light" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "ruff",
]
build = [
    "pyinstaller",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
line-ending = "lf"
