name: Mutation testing

# Manual only: mutation runs are slow and are for analysis, not a merge gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutmut:
    name: mutmut (formats + domain)
    runs-on: ubuntu-24.04 # mutmut needs fork(); pinned to match CI's Linux image
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-mutation.txt

      - name: Install pinned dependencies, mutmut and the package
        run: |
          python -m pip install -r requirements-dev.txt -r requirements-mutation.txt
          python -m pip install -e . --no-deps
          python -m pip freeze > mutation-env.txt

      - name: Run mutmut
        run: mutmut run

      - name: Summarise results
        if: always()
        run: |
          mutmut results > mutmut-results.txt 2>&1 || true
          mutmut export-cicd-stats || true
          {
            echo "## Mutation testing"
            echo
            echo "Commit: \`${GITHUB_SHA}\` · mutmut scope: formats/, domain/"
            echo
            if [ -f mutants/mutmut-cicd-stats.json ]; then
              echo '```json'
              cat mutants/mutmut-cicd-stats.json
              echo '```'
            else
              echo "No stats file was produced (no mutants to test yet, or the run failed)."
            fi
            echo
            echo "### Mutants not killed"
            echo '```'
            cat mutmut-results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutmut-results-${{ github.sha }}
          path: |
            mutants/mutmut-cicd-stats.json
            mutmut-results.txt
            mutation-env.txt
          if-no-files-found: warn
          retention-days: 90
